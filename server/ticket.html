<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - e-Ticket</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b132b;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs (Deep Blue Ambient) */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.35;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #2563eb;
            top: -100px;
            left: -100px;
        }

        .bg-blob-2 {
            background: #0284c7;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.08); }
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism Ticket Card with Glowing Neon Blue Border */
        .ticket-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25), 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }

        /* Ticket Header Bar */
        .ticket-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ticket-header h2 {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ticket-header p {
            color: #93c5fd;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Body Details */
        .ticket-body {
            padding: 24px;
        }

        .status-badge-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }

        .detail-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .detail-label {
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .detail-label i {
            color: #38bdf8;
            width: 16px;
        }

        .detail-value {
            color: #ffffff;
            font-weight: 600;
            text-align: right;
        }

        .highlight-value {
            color: #38bdf8;
            font-weight: 700;
        }

        .window-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .code-value {
            font-family: monospace;
            color: #c084fc;
            font-size: 1rem;
            font-weight: 700;
        }

        /* Boarding Pass Notched Divider */
        .ticket-divider {
            position: relative;
            border-top: 2px dashed rgba(255, 255, 255, 0.18);
            margin: 10px 0;
        }

        .ticket-divider::before,
        .ticket-divider::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 22px;
            height: 22px;
            background: #0b132b;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.5);
        }

        .ticket-divider::before {
            left: -13px;
        }

        .ticket-divider::after {
            right: -13px;
        }

        /* QR Code & Bottom Section */
        .ticket-footer {
            padding: 20px 24px 24px 24px;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
        }

        .qr-instruction {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .qr-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .qr-container img {
            display: block;
            width: 160px;
            height: 160px;
        }

        /* Action Buttons */
        .actions-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25 ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .logout-link {
            display: block;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: #94a3b8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="container">
        
        <div class="ticket-card">
            <!-- Header -->
            <div class="ticket-header">
                <h2><i class="fa-solid fa-ticket"></i> E-Ticket</h2>
                <p>Official Queueing Confirmation</p>
            </div>

            <!-- Ticket Details Body -->
            <div class="ticket-body">
                <div class="status-badge-container">
                    <span class="status-badge">
                        <i class="fa-solid fa-circle-check"></i> CONFIRMED
                    </span>
                </div>

                <div id="ticketInfo" class="detail-group">
                    <p style="text-align: center; color: #94a3b8;">Loading ticket details...</p>
                </div>
            </div>

            <!-- Notched Divider -->
            <div class="ticket-divider"></div>

            <!-- QR Code Section -->
            <div class="ticket-footer">
                <p class="qr-instruction">Present this QR code at your assigned Window</p>
                <div class="qr-container" id="qrContainer">
                    <!-- QR Code image will load here -->
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="actions-container">
            <a href="request.html" class="btn-secondary">
                <i class="fa-solid fa-plus"></i> Book Another Appointment
            </a>
            <a href="index.html" class="logout-link">← Log Out</a>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ticketCode = urlParams.get('code');

        async function fetchTicketDetails() {
            if (!ticketCode) {
                document.getElementById('ticketInfo').innerHTML = "<p style='text-align: center; color: #ef4444;'>No ticket code found.</p>";
                return;
            }

            try {
                const response = await fetch(`/api/ticket/${ticketCode}`);
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('ticketInfo').innerHTML = `
                        <div class="detail-row">
                            <span class="detail-label"><i class="fa-solid fa-user"></i> Name</span>
                            <span class="detail-value">${data.name || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i class="fa-solid fa-file-lines"></i> Service</span>
                            <span class="detail-value">${data.service || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i class="fa-solid fa-calendar"></i> Date</span>
                            <span class="detail-value highlight-value">${data.targetDate || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i class="fa-solid fa-clock"></i> Time Slot</span>
                            <span class="detail-value highlight-value">${data.targetTime || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i class="fa-solid fa-desktop"></i> Window</span>
                            <span class="detail-value"><span class="window-badge">${data.window || 'Window 1'}</span></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i class="fa-solid fa-barcode"></i> Ticket ID</span>
                            <span class="detail-value code-value">#${ticketCode}</span>
                        </div>
                    `;
                    
                    document.getElementById('qrContainer').innerHTML = `
                        <img src="/api/qrcode/${ticketCode}" alt="Appointment QR Code">
                    `;
                } else {
                    document.getElementById('ticketInfo').innerHTML = `<p style='text-align: center; color: #ef4444;'>${data.error || "Ticket not found."}</p>`;
                }
            } catch (err) {
                console.error("Error fetching ticket:", err);
                document.getElementById('ticketInfo').innerHTML = "<p style='text-align: center; color: #ef4444;'>Failed to load ticket details.</p>";
            }
        }

        fetchTicketDetails();
    </script>
</body>
</html>
