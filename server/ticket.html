<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - e-Ticket</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        h2 {
            color: #f8fafc;
            margin-bottom: 8px;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* Ticket Card Box */
        .ticket-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .success-title {
            color: #34d399;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ticket-details {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .ticket-details span {
            display: block;
            font-weight: 600;
            color: #f8fafc;
        }

        /* QR Code Styling */
        .qr-container {
            background: white;
            padding: 15px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .qr-container img {
            display: block;
            width: 180px;
            height: 180px;
        }

        /* Action Buttons */
        .btn-secondary {
            display: inline-block;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .logout-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: #f8fafc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="container">
        <h2>Book Appointment</h2>
        <p class="subtitle">Choose your service, preferred date, and time slot</p>
        
        <div class="ticket-card">
            <div class="success-title">
                <i class="fa-solid fa-circle-check"></i> Appointment Booked Successfully!
            </div>
            
            <div id="ticketInfo" class="ticket-details">
                Loading ticket details...
            </div>

            <div class="qr-container" id="qrContainer">
                <!-- QR Code image will load here -->
            </div>

            <div>
                <a href="request.html" class="btn-secondary">Book Another</a>
            </div>
        </div>

        <a href="index.html" class="logout-link">← Log Out</a>
    </div>

    <script>
        // Kunin ang ticket code mula sa URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const ticketCode = urlParams.get('code');

        async function fetchTicketDetails() {
            if (!ticketCode) {
                document.getElementById('ticketInfo').innerHTML = "No ticket code found.";
                return;
            }

            try {
                const response = await fetch(`/api/ticket/${ticketCode}`);
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('ticketInfo').innerHTML = `
                        <span>${data.name} | ${data.service} ${data.window ? '(' + data.window + ')' : ''}</span>
                        Date: ${data.targetDate} | Time: ${data.targetTime}
                    `;
                    
                    // I-display ang QR code galing sa backend o API
                    document.getElementById('qrContainer').innerHTML = `
                        <img src="/api/qrcode/${ticketCode}" alt="Appointment QR Code">
                    `;
                } else {
                    document.getElementById('ticketInfo').innerHTML = data.error || "Ticket not found.";
                }
            } catch (err) {
                console.error("Error fetching ticket:", err);
                document.getElementById('ticketInfo').innerHTML = "Failed to load ticket details.";
            }
        }

        fetchTicketDetails();
    </script>
</body>
</html>
