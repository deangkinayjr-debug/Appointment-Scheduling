<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | ICCT Registrar</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, #1e293b 0%, #0f172a 50%, #020617 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Blue Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.35;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #2563eb;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #0284c7;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card Container */
        .container {
            max-width: 540px;
            width: 100%;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        0 0 25px rgba(37, 99, 235, 0.15);
            overflow: hidden;
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            text-align: center;
            padding: 30px 20px 20px 20px;
        }

        .card-header h3 {
            color: #f8fafc;
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .card-header p {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0;
        }

        .card-body {
            padding: 30px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            font-size: 0.9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-control:focus, .form-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
            background-color: rgba(15, 23, 42, 0.95);
        }

        .form-select option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .mb-3 {
            margin-bottom: 18px !important;
        }

        /* Slot Buttons Styling */
        .btn-slot {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.88rem;
            transition: all 0.2s;
            padding: 12px 16px;
        }

        .btn-slot input[type="radio"] {
            display: none;
        }

        .btn-slot.available {
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            background-color: rgba(15, 23, 42, 0.5);
            cursor: pointer;
        }

        .btn-slot.available:hover {
            background-color: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
        }

        .btn-slot.selected {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-slot.selected .badge {
            background-color: rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        .btn-slot.full {
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            background-color: rgba(239, 68, 68, 0.1);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .bg-success {
            background-color: rgba(16, 185, 129, 0.2) !important;
            color: #34d399 !important;
        }

        .bg-danger {
            background-color: rgba(239, 68, 68, 0.2) !important;
            color: #fca5a5 !important;
        }

        /* Primary Submit Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.7);
        }

        /* Ticket Container Styles */
        #ticketContainer {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 24px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            border: 1px dashed rgba(56, 189, 248, 0.3);
        }

        #ticketContainer h4 {
            color: #34d399;
            font-weight: 700;
            margin-bottom: 10px;
        }

        #ticketInfo {
            color: #f8fafc;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        #qrcode {
            background: white;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
        }

        .btn-outline-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        /* Log out link */
        .text-center.mt-3 a {
            color: #fca5a5;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .text-center.mt-3 a:hover {
            color: #ef4444;
            text-decoration: underline !important;
        }

        /* Text muted adjustments */
        .text-muted {
            color: #94a3b8 !important;
        }

        /* ========================================================== */
        /* CALENDAR DAY STATUS STYLES                                 */
        /* ========================================================== */
        .flatpickr-day.calendar-available {
            background-color: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
            font-weight: bold;
        }

        .flatpickr-day.calendar-full {
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
            position: relative;
        }
        .flatpickr-day.calendar-full::after {
            content: "FULL";
            display: block;
            font-size: 8px;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-top: -2px;
        }
    </style>
</head>
<body>

<!-- Background Glow Blobs -->
<div class="bg-blob-1"></div>
<div class="bg-blob-2"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>Book Appointment</h3>
            <p class="mb-0">Choose your service, date, and time slot</p>
        </div>
        <div class="card-body p-4">
            <form id="appointmentForm">
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="nameInput" required>
                </div>
                <div class="mb-3">
                    <label for="emailInput" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="emailInput" required>
                </div>
                <div class="mb-3">
                    <label for="serviceSelect" class="form-label">Type of Service</label>
                    <select class="form-select" id="serviceSelect" required>
                        <option value="" selected disabled>Select a Service...</option>
                        <option value="Transcript of Records (TOR)">Transcript of Records (TOR)</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Certificate of Enrollment">Certificate of Enrollment</option>
                        <option value="Certification of Grades">Certification of Grades</option>
                        <option value="Summary of Grades">Summary of Grades</option>
                        <option value="Certificate of Good Moral Character">Certificate of Good Moral Character</option>
                        <option value="Honorable Dismissal">Honorable Dismissal</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">📅 Select Pickup Date:</label>
                    <input type="text" id="datePicker" class="form-control" placeholder="Click to select date..." required>
                    <input type="hidden" id="selectedDateInput">
                </div>

                <div class="mb-3" id="timeSlotGroup" style="display: none;">
                    <label class="form-label">⏰ Select Time Slot:</label>
                    <div id="timeSlotsContainer"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Get e-Ticket</button>
            </form>

            <div id="ticketContainer">
                <h4>🎉 Appointment Successfully Booked!</h4>
                <p id="ticketInfo" class="fw-bold mt-2"></p>
                <div id="qrcode" class="d-flex justify-content-center my-3"></div>
                <div>
                    <button class="btn btn-outline-secondary btn-sm mt-2" onclick="location.reload()">Book Another</button>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="text-decoration-none">← Log Out</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    const defaultTimeSlots = [
        "9:00 AM - 10:00 AM",
        "10:00 AM - 11:00 AM",
        "11:00 AM - 12:00 NN",
        "1:00 PM - 2:00 PM",
        "2:00 PM - 3:00 PM",
        "3:00 PM - 4:00 PM",
        "4:00 PM - 5:00 PM",
        "5:00 PM - 6:00 PM"
    ];

    const loggedUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (loggedUser.name) {
        document.getElementById('nameInput').value = loggedUser.name;
        document.getElementById('emailInput').value = loggedUser.email || '';
    }

    let selectedDateStr = "";
    let globalSlotStatusCache = {};

    async function initCalendar() {
        let enabledDates = [];
        try {
            const res = await fetch('/api/available-dates');
            enabledDates = await res.json();
        } catch (err) {
            console.error("Error loading available dates:", err);
        }

        const calendarConfig = {
            dateFormat: "Y-m-d",
            minDate: "today",
            onChange: function(selectedDates, dateStr) {
                selectedDateStr = dateStr;
                document.getElementById('selectedDateInput').value = dateStr;
                document.getElementById('timeSlotGroup').style.display = 'block';
                loadAvailableSlots(dateStr);
            },
            onDayCreate: async function(dObj, dStr, fp, dayElem) {
                const year = dayElem.dateObj.getFullYear();
                const month = String(dayElem.dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dayElem.dateObj.getDate()).padStart(2, '0');
                const dateKey = `${year}-${month}-${day}`;

                if (enabledDates && enabledDates.length > 0 && !enabledDates.includes(dateKey)) {
                    return;
                }

                if (globalSlotStatusCache[dateKey] !== undefined) {
                    applyCalendarDayStyle(dayElem, globalSlotStatusCache[dateKey]);
                    return;
                }

                try {
                    const res = await fetch(`/api/slot-status/${dateKey}`);
                    const slotData = await res.json();
                    
                    let isFullyBooked = true;
                    let hasAnySlot = false;

                    if (slotData && typeof slotData === 'object' && Object.keys(slotData).length > 0) {
                        for (let timeSlot of defaultTimeSlots) {
                            let info = slotData[timeSlot];
                            if (info !== undefined) {
                                hasAnySlot = true;
                                let limit = typeof info === 'object' ? info.limit : info;
                                let booked = typeof info === 'object' ? (info.booked || 0) : 0;
                                if (limit > 0 && booked < limit) {
                                    isFullyBooked = false;
                                    break;
                                }
                            }
                        }
                    } else {
                        isFullyBooked = false;
                        hasAnySlot = false;
                    }

                    const statusResult = { hasAnySlot, isFullyBooked };
                    globalSlotStatusCache[dateKey] = statusResult;
                    applyCalendarDayStyle(dayElem, statusResult);
                } catch (err) {
                    // Ignore error
                }
            }
        };

        if (enabledDates && enabledDates.length > 0) {
            calendarConfig.enable = enabledDates;
        }

        flatpickr("#datePicker", calendarConfig);
    }

    function applyCalendarDayStyle(dayElem, status) {
        if (!status.hasAnySlot) {
            return;
        }
        
        if (status.isFullyBooked) {
            dayElem.classList.add('calendar-full');
        } else {
            dayElem.classList.add('calendar-available');
        }
    }

    async function loadAvailableSlots(date) {
        const container = document.getElementById('timeSlotsContainer');
        if (!container) return;
        
        container.innerHTML = "<p class='text-muted text-center'>Loading time slots...</p>";

        let slotStatusData = {};
        try {
            const res = await fetch(`/api/slot-status/${date}`);
            slotStatusData = await res.json();
        } catch (err) {
            console.error("Error fetching slots:", err);
            container.innerHTML = "<p class='text-danger text-center'>Error loading slots. Please try again.</p>";
            return;
        }

        container.innerHTML = "";
        let hasAvailable = false;

        defaultTimeSlots.forEach(timeSlot => {
            let slotInfo = slotStatusData[timeSlot];
            let isFull = true;
            let bookedCount = 0;
            let limitCount = 50;

            if (slotInfo !== undefined) {
                limitCount = typeof slotInfo === 'object' ? slotInfo.limit : slotInfo;
                bookedCount = typeof slotInfo === 'object' ? (slotInfo.booked || 0) : 0;
                
                if (limitCount > 0 && bookedCount < limitCount) {
                    isFull = false;
                }
            } else {
                isFull = false;
            }

            if (!isFull) hasAvailable = true;

            const label = document.createElement('label');
            label.className = `btn btn-slot ${isFull ? 'full' : 'available'}`;
            
            label.innerHTML = `
                <span>${timeSlot}</span>
                <span class="badge ${isFull ? 'bg-danger' : 'bg-success'}">
                    ${isFull ? 'Unavailable (Full)' : `Available (${bookedCount}/${limitCount})`}
                </span>
            `;

            if (!isFull) {
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'timeSlot';
                radio.value = timeSlot;
                radio.required = true;
                
                radio.addEventListener('change', () => {
                    document.querySelectorAll('.btn-slot').forEach(b => b.classList.remove('selected'));
                    label.classList.add('selected');
                });

                label.prepend(radio);
            } else {
                label.style.pointerEvents = 'none';
            }

            container.appendChild(label);
        });

        if (!hasAvailable) {
            container.innerHTML = "<p class='text-muted text-center py-3'>No available time slots or fully booked for this date.</p>";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });

    const form = document.getElementById('appointmentForm');
    const ticketContainer = document.getElementById('ticketContainer');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const studentName = document.getElementById('nameInput').value;
        const email = document.getElementById('emailInput').value;
        const service = document.getElementById('serviceSelect').value;
        const targetDate = document.getElementById('selectedDateInput').value;
        const targetTime = document.querySelector('input[name="timeSlot"]:checked')?.value;

        if (!targetDate || !targetTime) {
            alert("Please select both a date and a time slot.");
            return;
        }

        try {
            const response = await fetch('/api/appointments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: studentName, email, service, targetDate, targetTime })
            });

            const data = await response.json();

            if (response.ok) {
                form.style.display = 'none';
                ticketContainer.style.display = 'block';
                ticketContainer.innerHTML = `
                    <div style="text-align: center; padding: 15px;">
                        <div style="font-size: 2.5rem; margin-bottom: 10px;">🎉</div>
                        <h3 style="color: #4ade80; font-size: 1.2rem; margin-bottom: 12px; font-weight: 700;">
                            Appointment Successfully Booked!
                        </h3>
                        <p style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.6; margin-bottom: 15px;">
                            An e-Ticket together with your <strong>Official QR Code</strong> has been sent to your email:
                            <br/>
                            <strong style="color: #38bdf8; word-break: break-all;">${email}</strong>
                        </p>
                        <div style="background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 10px; border: 1px dashed rgba(255, 255, 255, 0.1); font-size: 0.8rem; color: #94a3b8; text-align: left; margin-bottom: 20px;">
                            📌 <strong>Reminder:</strong> Please check your Inbox or Spam folder. Present the QR code received in your email at <strong>${data.window || 'the designated window'}</strong> on <strong>${targetDate}</strong> (${targetTime}).
                        </div>
                        <button onclick="window.location.reload()" class="btn btn-primary" style="margin: 0 auto; width: 100%; max-width: 220px; font-size: 0.85rem;">
                            Book Another Appointment
                        </button>
                    </div>
                `;
            } else {
                alert(data.error || data.message || "Failed to create appointment.");
                if (selectedDateStr) loadAvailableSlots(selectedDateStr);
            }
        } catch (err) {
            console.error("Error:", err);
            alert("Cannot connect to the server.");
        }
    });
</script>

</body>
</html>
