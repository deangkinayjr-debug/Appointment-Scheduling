<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mag-book ng Appointment | ICCT Registrar</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 520px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-container h2 {
            color: #f8fafc;
            margin: 0 0 6px 0;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-container h2 i {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        select option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .time-slots-container {
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            padding: 10px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        .logout-container {
            text-align: center;
            margin-top: 20px;
        }

        .logout-link {
            color: #fca5a5;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .logout-link:hover {
            color: #ef4444;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="card">
        <div class="header-container">
            <h2><i class="fa-solid fa-calendar-check"></i> Mag-book ng Appointment</h2>
            <p class="subtitle">Piliin ang iyong serbisyo, petsa, at oras</p>
        </div>

        <form id="bookingForm">
            <!-- Full Name Field -->
            <div class="input-group">
                <label for="fullName"><i class="fa-solid fa-user"></i> Buong Pangalan</label>
                <input type="text" id="fullName" placeholder="Jan Cristan R. Deangkinay" readonly>
            </div>

            <!-- Email Address Field -->
            <div class="input-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="jayceeramos307@gmail.com">
            </div>

            <!-- Service Type Field -->
            <div class="input-group">
                <label for="serviceType"><i class="fa-solid fa-file-lines"></i> Uri ng Serbisyo</label>
                <select id="serviceType" required>
                    <option value="" disabled selected>Piliin ang serbisyo...</option>
                    <option value="Certification of Grades">Certification of Grades</option>
                    <option value="Transcript of Records (TOR)">Transcript of Records (TOR)</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Honorable Dismissal">Honorable Dismissal</option>
                </select>
            </div>

            <!-- Date Selection -->
            <div class="input-group">
                <label for="appointmentDate"><i class="fa-solid fa-calendar"></i> Pumili ng Petsa ng Pagkuha</label>
                <input type="date" id="appointmentDate" required>
            </div>

            <!-- Time Slots Section -->
            <div class="input-group">
                <label><i class="fa-solid fa-clock"></i> Pumili ng Oras</label>
                <div id="timeSlotsContainer" class="time-slots-container">
                    Walang available na oras o hindi pa naitakda ng Registrar ang mga oras para sa petsang ito.
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-ticket"></i> Get e-Ticket
            </button>
        </form>

        <div class="logout-container">
            <a href="index.html" class="logout-link"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
        </div>
    </div>

</body>
</html>
