<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - Book Appointment</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        h2 {
            color: #f8fafc;
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="text"], input[type="email"], select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder, input[type="email"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus, input[type="email"]:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        select option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        .logout-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: #f8fafc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="container">
        <h2>Book Appointment</h2>
        <p class="subtitle">Choose your service, preferred date, and time slot</p>
        
        <form id="appointmentForm" onsubmit="submitAppointment(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="service">Type of Service</label>
                <select id="service" required>
                    <option value="" disabled selected>Select a service...</option>
                    <option value="Transcript of Records (TOR)">Transcript of Records (TOR)</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Certificate of Good Moral Character">Certificate of Good Moral Character</option>
                    <option value="Honorable Dismissal">Honorable Dismissal</option>
                    <option value="Authentication of Documents">Authentication of Documents</option>
                    <option value="Certificate of Enrollment">Certificate of Enrollment</option>
                    <option value="Certification of Grades">Certification of Grades</option>
                    <option value="Summary of Grades">Summary of Grades</option>
                </select>
            </div>

            <div class="form-group">
                <label for="targetDate">Target Pickup Date:</label>
                <input type="text" id="targetDate" placeholder="Click to select date..." required>
            </div>

            <div class="form-group">
                <label for="targetTime">Preferred Time Slot:</label>
                <select id="targetTime" required>
                    <option value="" disabled selected>Select available time slot...</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Get e-Ticket</button>
        </form>

        <a href="index.html" class="logout-link">← Log Out</a>
    </div>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        let enabledDates = [];

        // Auto-fill user info kung galing sa login
        window.addEventListener('DOMContentLoaded', () => {
            const loggedUser = JSON.parse(localStorage.getItem('loggedUser') || '{}');
            if (loggedUser.name) {
                document.getElementById('fullName').value = loggedUser.name;
            }
            if (loggedUser.email) {
                document.getElementById('email').value = loggedUser.email;
            }
            fetchAvailableSlots();
        });

        async function fetchAvailableSlots() {
            try {
                const response = await fetch('/api/slots');
                const slots = await response.json();
                enabledDates = slots.map(s => s.date);

                flatpickr("#targetDate", {
                    dateFormat: "Y-m-d",
                    enable: enabledDates,
                    minDate: "today",
                    onChange: function(selectedDates, dateStr) {
                        loadTimeSlotsForDate(dateStr);
                    }
                });
            } catch (err) {
                console.error("Error fetching slots:", err);
            }
        }

        async function loadTimeSlotsForDate(date) {
            const timeSelect = document.getElementById('targetTime');
            timeSelect.innerHTML = '<option value="" disabled selected>Loading time slots...</option>';

            try {
                // Nakakonekta na ngayon sa tamang backend route na /api/slot-status/${date}
                const response = await fetch(`/api/slot-status/${date}`);
                const slotStatus = await response.json();

                timeSelect.innerHTML = '<option value="" disabled selected>Select available time slot...</option>';
                
                let hasAvailable = false;

                for (const [timeSlot, info] of Object.entries(slotStatus)) {
                    const opt = document.createElement('option');
                    opt.value = timeSlot;
                    
                    if (info.isFull) {
                        opt.textContent = `${timeSlot} (Fully Booked - ${info.booked}/${info.limit})`;
                        opt.disabled = true;
                    } else {
                        opt.textContent = `${timeSlot} (${info.booked}/${info.limit} booked)`;
                        hasAvailable = true;
                    }
                    timeSelect.appendChild(opt);
                }

                if (!hasAvailable && Object.keys(slotStatus).length > 0) {
                    const opt = document.createElement('option');
                    opt.disabled = true;
                    opt.textContent = "All time slots are fully booked for this date";
                    timeSelect.appendChild(opt);
                }
            } catch (err) {
                console.error("Error loading time slots:", err);
                timeSelect.innerHTML = '<option value="" disabled selected>Failed to load time slots</option>';
            }
        }

        async function submitAppointment(event) {
            event.preventDefault();

            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const service = document.getElementById('service').value;
            const targetDate = document.getElementById('targetDate').value;
            const targetTime = document.getElementById('targetTime').value;

            try {
                const response = await fetch('/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, service, targetDate, targetTime })
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Appointment successfully booked! Your e-Ticket code is: " + (result.id || result.ticketCode));
                    window.location.href = `ticket.html?code=${result.id || result.ticketCode}`;
                } else {
                    alert(result.error || "Failed to book appointment.");
                }
            } catch (err) {
                console.error("Error submitting appointment:", err);
                alert("Cannot connect to the server.");
            }
        }
    </script>
</body>
</html>
