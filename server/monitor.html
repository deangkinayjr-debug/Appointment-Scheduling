<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar Live Queue Monitor</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing Background Orbs (Para pareho sa login page) */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Header Styles */
        .monitor-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .monitor-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .monitor-header h1 i {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .monitor-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Dashboard Grid Layout */
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism Card Container */
        .queue-card-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 480px;
            display: flex;
            flex-direction: column;
        }

        .column-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .waiting-title { color: #f59e0b; }
        .ready-title { color: #10b981; }

        /* List Items / Ticket Cards */
        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-grow: 1;
        }

        .queue-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .queue-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
        }

        .queue-item.waiting::before { background: #f59e0b; }
        .queue-item.ready::before { background: #10b981; }

        .queue-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .student-name {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .service-type {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .status-badge.waiting {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .status-badge.ready {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            color: #64748b;
            text-align: center;
            font-size: 14px;
            gap: 12px;
        }

        .empty-state i {
            font-size: 36px;
            opacity: 0.4;
        }

        @media (max-width: 768px) {
            body { padding: 20px 12px; }
            .monitor-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Background Glow Effects -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="monitor-header">
        <h1><i class="fa-solid fa-display"></i> ICCT Registrar Live Queue Monitor</h1>
        <p>Real-time display of active student queues and assigned service windows.</p>
    </div>

    <div class="monitor-grid">
        <!-- Waiting Queue Column -->
        <div class="queue-card-container">
            <div class="column-title waiting-title">
                <i class="fa-solid fa-clock"></i> Waiting Queue
            </div>
            <div id="waitingQueueList" class="queue-list">
                <!-- Halimbawa ng item (magagamit din kung saan nakakabit ang JS mo) -->
                <div class="queue-item waiting">
                    <div class="student-name">Juan Dela Cruz</div>
                    <div class="service-type"><i class="fa-solid fa-file-lines"></i> Transcript of Records (TOR)</div>
                    <div class="meta-info">
                        <span class="window-badge"><i class="fa-solid fa-desktop"></i> Window 3</span>
                        <span class="status-badge waiting">Waiting</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ready for Pickup Column -->
        <div class="queue-card-container">
            <div class="column-title ready-title">
                <i class="fa-solid fa-circle-check"></i> Ready for Pickup
            </div>
            <div id="readyQueueList" class="queue-list">
                <div class="empty-state">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>No documents ready for pickup.</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
