<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - Staff Login</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h2 {
            color: #f8fafc;
            margin-bottom: 8px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(239, 68, 68, 0.6);
        }

        .error { 
            color: #fca5a5; 
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem; 
            margin-top: 15px; 
            display: none; 
        }

        .nav-link { 
            display: inline-block; 
            margin-top: 25px; 
            color: #818cf8; 
            font-size: 0.88rem; 
            font-weight: 600;
            text-decoration: none; 
            transition: color 0.2s;
        }

        .nav-link:hover { 
            color: #a5b4fc;
            text-decoration: underline; 
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="card">
        <h2>Registrar Staff Portal</h2>
        <p class="subtitle">Please log in using your Admin Credentials.</p>
        
        <form id="adminLoginForm">
            <input type="text" id="adminUser" placeholder="Username (e.g., registrar)" required>
            <input type="password" id="adminPass" placeholder="Password (e.g., icct123)" required>
            <button type="submit">Log in as Staff</button>
            <p id="errorMsg" class="error">Invalid username or password!</p>
        </form>

        <a href="index.html" class="nav-link">&larr; Back to Student Portal</a>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            // Simple hardcoded check para sa demo (Pwede mong baguhin ang username/password)
            if (user === 'registrar admin' && pass === 'icct1245') {
                // I-save ang session na naka-login na ang admin
                localStorage.setItem('isAdminLoggedIn', 'true');
                // Diretso sa secure staff dashboard
                window.location.href = 'staff.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
