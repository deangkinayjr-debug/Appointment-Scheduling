<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - Student Portal</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
        }

        h2 {
            color: #f8fafc;
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .input-field-wrapper {
            position: relative;
        }

        .input-field-wrapper i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        button.submit-btn:active {
            transform: scale(0.98);
        }

        #errorMsg, #successMsg {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 18px;
            display: none;
            text-align: center;
        }

        #errorMsg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        #successMsg {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .toggle-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .toggle-text a {
            color: #a855f7;
            font-weight: 600;
            text-decoration: none;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            margin-top: 22px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }

        .demo-credentials strong {
            color: #cbd5e1;
        }

        .demo-credentials code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="card">
        <div class="header-container">
            <div class="logo-badge" style="background: white; width: 75px; height: 75px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; overflow: hidden; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); border: 2px solid rgba(255, 255, 255, 0.2);">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTN3hZj6Rd5pRURlNV10J-9p3i-yZPGXVWQTcH2MY8g6Q&s=10" alt="ICCT Logo" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h2>Student Portal</h2>
            <p class="subtitle">ICCT Registrar Queueing System</p>
        </div>

        <div id="errorMsg"></div>
        <div id="successMsg"></div>
        
        <!-- LOGIN FORM -->
        <form id="loginForm">
            <!-- Student Number Field -->
            <div class="input-group">
                <label for="loginStudentNumber">Student Number</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="loginStudentNumber" placeholder="e.g., CA202306112" required>
                </div>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Secure Login
            </button>

            <p class="toggle-text">
                Don't have an account? <a href="#" id="showRegister">Register here</a>
            </p>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" style="display: none;">
            <!-- Full Name Field -->
            <div class="input-group">
                <label for="regFullName">Full Name</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regFullName" placeholder="e.g., Jan Cristan Deangkinay" required>
                </div>
            </div>

            <!-- Student Number Field -->
            <div class="input-group">
                <label for="regStudentNumber">Student Number</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="regStudentNumber" placeholder="e.g., CA202306112" required>
                </div>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="regPassword">Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="input-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regConfirmPassword" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Register Account
            </button>

            <p class="toggle-text">
                Already have an account? <a href="#" id="showLogin">Login here</a>
            </p>
        </form>

        
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const showRegisterBtn = document.getElementById('showRegister');
        const showLoginBtn = document.getElementById('showLogin');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const demoBox = document.getElementById('demoBox');

        // Toggle to Registration Form
        showRegisterBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            demoBox.style.display = 'none';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        });

        // Toggle back to Login Form
        showLoginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            demoBox.style.display = 'block';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        });

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const studentNumber = document.getElementById('loginStudentNumber').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentNumber, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('studentName', data.user.name);
                    localStorage.setItem('studentNumber', data.user.studentNumber);
                    window.location.href = 'request.html';
                } else {
                    errorMsg.innerText = data.error || "Invalid credentials provided.";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Login Error:", err);
                errorMsg.innerText = "Unable to connect to the server.";
                errorMsg.style.display = 'block';
            }
        });

        // Registration Handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const fullName = document.getElementById('regFullName').value.trim();
            const studentNumber = document.getElementById('regStudentNumber').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match!";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, studentNumber, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successMsg.innerText = "Registration successful! You can now login.";
                    successMsg.style.display = 'block';
                    registerForm.reset();
                    setTimeout(() => {
                        registerForm.style.display = 'none';
                        loginForm.style.display = 'block';
                        demoBox.style.display = 'block';
                        successMsg.style.display = 'none';
                    }, 2000);
                } else {
                    errorMsg.innerText = data.error || "Registration failed.";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Registration Error:", err);
                errorMsg.innerText = "Unable to connect to the server.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
