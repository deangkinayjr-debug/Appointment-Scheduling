<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - Student Login</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
        }

        h2 {
            color: #f8fafc;
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .input-field-wrapper {
            position: relative;
        }

        .input-field-wrapper i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        button.submit-btn:active {
            transform: scale(0.98);
        }

        #errorMsg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 18px;
            display: none;
            text-align: center;
        }

        .demo-credentials {
            margin-top: 22px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }

        .demo-credentials strong {
            color: #cbd5e1;
        }

        .demo-credentials code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="card">
        <div class="header-container">
            <div class="logo-badge">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>Student Portal</h2>
            <p class="subtitle">ICCT Registrar Queueing System</p>
        </div>

        <div id="errorMsg"></div>
        
        <form id="loginForm">
            <!-- Full Name Field -->
            <div class="input-group">
                <label for="fullName">Buong Pangalan</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="fullName" placeholder="e.g., Jan Cristan Deangkinay" required>
                </div>
            </div>

            <!-- Student Number Field -->
            <div class="input-group">
                <label for="studentNumber">Student Number</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid id-card fa-id-card"></i>
                    <input type="text" id="studentNumber" placeholder="e.g., CA202306112" required>
                </div>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Secure Login
            </button>
        </form>

        <div class="demo-credentials">
            <strong>DEMO ACCOUNT</strong><br>
            Name: <span>Jan Cristan Deangkinay</span><br>
            No: <code>CA202306112</code> | Pass: <code>password123</code>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const fullName = document.getElementById('fullName').value.trim();
            const studentNumber = document.getElementById('studentNumber').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, studentNumber, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Masisave ang pangalan at student number sa localStorage para magamit sa queue request
                    localStorage.setItem('studentName', fullName || data.user.name);
                    localStorage.setItem('studentNumber', data.user.studentNumber);
                    
                    window.location.href = 'request.html';
                } else {
                    errorMsg.innerText = data.error || "Invalid credentials provided.";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Login Error:", err);
                errorMsg.innerText = "Unable to connect to the server.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
