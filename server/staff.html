<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Staff Dashboard | Queueing System</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -100px;
            left: -100px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Main Dashboard Container */
        .dashboard-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Header Layout */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title-wrapper h1 {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .header-title-wrapper h1 i {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title-wrapper p {
            color: #94a3b8;
            font-size: 13px;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-2px);
        }

        /* Card Sections */
        .section-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #38bdf8;
        }

        /* Form Controls & Inputs */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        /* Queue Table / Item Cards */
        .queue-row-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .student-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .student-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        .queue-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .dashboard-container { padding: 20px 15px; }
            .queue-row-item { flex-direction: column; align-items: flex-start; }
            .queue-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="header-title-wrapper">
                <h1><i class="fa-solid fa-gauge-high"></i> Registrar Staff Dashboard</h1>
                <p>Magtakda ng mga available dates at time slots para sa mga estudyante at pamahalaan ang mga naka-queue.</p>
            </div>
            <a href="admin-login.html" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
        </div>

        <!-- Slot Management Section -->
        <div class="section-box">
            <div class="section-title">
                <i class="fa-solid fa-calendar-days"></i> Magbukas ng Appointment Date / Max Slots
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Piliin ang Petsa:</label>
                    <input type="date" id="slotDate">
                </div>
                <div class="input-group">
                    <label>Pangkalahatang Max Limit:</label>
                    <input type="number" id="maxLimit" placeholder="e.g., 50">
                </div>
            </div>
            <button class="btn-primary"><i class="fa-solid fa-plus"></i> I-save ang Petsa</button>
        </div>

        <!-- Active Student Queue Section -->
        <div class="section-box" style="margin-bottom: 0;">
            <div class="section-title">
                <i class="fa-solid fa-users"></i> Active Student Queue
            </div>
            <div id="staffQueueList">
                <!-- Sample Queue Item -->
                <div class="queue-row-item">
                    <div class="student-info">
                        <h4>Juan Dela Cruz</h4>
                        <p><i class="fa-solid fa-file-lines" style="color: #38bdf8;"></i> Transcript of Records (TOR) • 2026-09-30 (9:00 AM)</p>
                    </div>
                    <div class="queue-actions">
                        <select class="input-group" style="padding: 8px 12px; font-size: 13px;">
                            <option value="Waiting">Waiting</option>
                            <option value="Ready">Ready</option>
                            <option value="Claimed">Claimed</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
