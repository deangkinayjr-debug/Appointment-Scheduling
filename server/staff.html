<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Registrar - Staff Dashboard</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Glowing Background Orbs */
        .bg-blob-1, .bg-blob-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bg-blob-1 {
            background: #6366f1;
            top: -50px;
            left: -50px;
        }

        .bg-blob-2 {
            background: #ec4899;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }

        h2 {
            color: #f8fafc;
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        h2 span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .section-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .section-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.05rem;
            color: #f8fafc;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder, input[type="number"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        select option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            height: 47px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        ul { list-style: none; padding: 0; margin: 0; }

        li {
            background: rgba(15, 23, 42, 0.6);
            margin-bottom: 12px;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        li:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-claimed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-claimed:hover { 
            background: #10b981; 
            color: white;
            border-color: #10b981;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-logout:hover { 
            background: #ef4444; 
            color: white;
            border-color: #ef4444;
        }

        .empty-state { text-align: center; color: #94a3b8; padding: 25px; font-style: italic; font-size: 0.9rem; }

        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .time-slot-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .time-slot-item span {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        .time-slot-item input {
            width: 65px;
            text-align: center;
            padding: 6px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="container">
        <h2>
            <span><i class="fa-solid fa-desktop"></i> Registrar Staff Dashboard</span>
            <button class="btn-logout" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
        </h2>
        <p class="subtitle">Set available dates and time slot limits for students and manage active queues.</p>
        
        <!-- SECTION PARA SA PANGKALAHATANG SLOT (PINATANGGAL ANG OVERALL MAX LIMIT) -->
        <div class="section-box">
            <h3><i class="fa-solid fa-calendar-plus" style="color: #818cf8;"></i> Open Appointment Date</h3>
            <form id="slotForm" onsubmit="createSlot(event)">
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label for="slotDate">Select Date:</label>
                        <input type="text" id="slotDate" placeholder="Select date..." required>
                    </div>
                    <button type="submit" class="btn-primary" style="flex: 1;"><i class="fa-solid fa-plus"></i> Activate Date</button>
                </div>
            </form>
        </div>

        <!-- SECTION PARA SA BAWAT ORAS NA LIMIT (TIME SLOTS) -->
        <div class="section-box" id="timeLimitsBox" style="display: none;">
            <h3><i class="fa-solid fa-clock" style="color: #38bdf8;"></i> Set Time Limits for Selected Date</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0; margin-bottom: 10px;">Enter the maximum number of students allowed to book per time slot.</p>
            
            <div class="time-slots-grid" id="timeSlotsContainer">
                <!-- Dito ilalagay automatically ang oras gamit ang JS -->
            </div>
            
            <button type="button" class="btn-primary" onclick="saveTimeLimits()"><i class="fa-solid fa-save"></i> Save Time Limits</button>
        </div>

        <h3 style="color: #f8fafc; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-users-line" style="color: #34d399;"></i> Active Student Queue</h3>
        <ul id="queueList">
            <div class="empty-state">Loading queue data...</div>
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert("Unauthorized access! Please log in as Registrar Staff first.");
            window.location.href = 'admin-login.html';
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'admin-login.html';
        }

        const standardHours = [
            "9:00 AM - 10:00 AM",
            "10:00 AM - 11:00 AM",
            "11:00 AM - 12:00 NN",
            "1:00 PM - 2:00 PM",
            "2:00 PM - 3:00 PM",
            "3:00 PM - 4:00 PM",
            "4:00 PM - 5:00 PM",
            "5:00 PM - 6:00 PM"
        ];

        // I-initialize ang Flatpickr para sa format na YYYY-MM-DD
        flatpickr("#slotDate", {
            dateFormat: "Y-m-d",
            minDate: "today",
            onChange: function(selectedDates, dateStr) {
                loadExistingTimeLimits(dateStr);
            }
        });

        function renderTimeSlots(savedLimits = {}) {
            const container = document.getElementById('timeSlotsContainer');
            container.innerHTML = '';
            
            standardHours.forEach((hour, index) => {
                const currentLimit = savedLimits[hour] !== undefined ? savedLimits[hour] : 10;
                const div = document.createElement('div');
                div.className = 'time-slot-item';
                div.innerHTML = `
                    <span>${hour}</span>
                    <input type="number" id="hour_limit_${index}" data-hour="${hour}" value="${currentLimit}" min="0">
                `;
                container.appendChild(div);
            });
            document.getElementById('timeLimitsBox').style.display = 'block';
        }

        async function loadExistingTimeLimits(dateOverride = null) {
            const date = dateOverride || document.getElementById('slotDate').value;
            if (!date) return;

            try {
                const response = await fetch(`/api/time-limits/${date}`);
                const limits = await response.json();
                renderTimeSlots(limits);
            } catch (err) {
                console.error("Error loading time limits:", err);
                renderTimeSlots({});
            }
        }

        async function createSlot(event) {
            event.preventDefault();
            const date = document.getElementById('slotDate').value;

            try {
                const response = await fetch('/api/slots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, limit: 50 })
                });
                const result = await response.json();
                if (response.ok) {
                    alert("Successfully activated date: " + date);
                    loadExistingTimeLimits(date);
                } else {
                    alert(result.error || "Error activating date.");
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Failed to connect to server.");
            }
        }

        async function saveTimeLimits() {
            const date = document.getElementById('slotDate').value;
            if (!date) {
                alert("Please select a date first.");
                return;
            }

            const limits = {};
            standardHours.forEach((hour, index) => {
                const inputVal = document.getElementById(`hour_limit_${index}`).value;
                limits[hour] = parseInt(inputVal) || 0;
            });

            try {
                const response = await fetch('/api/staff/set-time-limits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, limits })
                });
                const result = await response.json();
                if (response.ok) {
                    alert("Time slot limits saved successfully!");
                } else {
                    alert(result.error || "Error saving limits.");
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Failed to connect to server.");
            }
        }

        async function fetchQueue() {
            try {
                const response = await fetch('/api/appointments');
                const appointments = await response.json();
                const list = document.getElementById('queueList');
                list.innerHTML = '';

                if (appointments.length === 0) {
                    list.innerHTML = '<div class="empty-state">No current queue or bookings found.</div>';
                    return;
                }

                appointments.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div>
                            <strong style="font-size: 1.05rem; color: #f8fafc;">${item.name}</strong> <br>
                            <span style="color: #94a3b8; font-size: 0.85rem;"><i class="fa-solid fa-file-lines"></i> ${item.service}</span> &bull; 
                            <span style="color: #818cf8; font-size: 0.85rem; font-weight: 600;"><i class="fa-solid fa-calendar"></i> Target Pickup: ${item.targetDate || 'Not specified'} (${item.targetTime || 'Time unspecified'})</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <select onchange="updateStatus('${item.id}', this.value)">
                                <option value="Waiting" ${item.status === 'Waiting' ? 'selected' : ''}>Waiting</option>
                                <option value="Ready for Pickup" ${item.status === 'Ready for Pickup' ? 'selected' : ''}>Ready for Pickup</option>
                            </select>
                            <button class="btn-claimed" onclick="markAsClaimed('${item.id}', '${item.name}')">
                                <i class="fa-solid fa-check"></i> Claimed
                            </button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Error fetching queue:", err);
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                await fetch(`/api/appointments/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                fetchQueue();
            } catch (err) { console.error(err); }
        }

        async function markAsClaimed(id, studentName) {
            if (!confirm(`Mark document for ${studentName} as Claimed and finish transaction?`)) return;
            try {
                await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
                fetchQueue();
            } catch (err) { console.error(err); }
        }

        fetchQueue();
        setInterval(fetchQueue, 3000);
    </script>
</body>
</html>
